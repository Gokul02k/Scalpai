<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040810" />
    <title>ScalpAI — offline</title>
    <!--
      Shown only when a navigation fails with no network.

      It deliberately displays no prices, no last-known signal and no numbers
      of any kind. The cached dashboard would look live while being minutes or
      hours stale, and there is no honest way to label that on a screen someone
      might trade from. An empty screen that says "offline" cannot mislead.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        background: #040810;
        color: #e6edf6;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
              "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; opacity: 0.9; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; max-width: 34ch; color: #8b9bb4; font-size: 14px; }
      button {
        margin-top: 4px;
        padding: 11px 22px;
        border: 0;
        border-radius: 10px;
        background: #00e676;
        color: #04240f;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>No connection</h1>
    <p>
      ScalpAI is not showing prices because it cannot reach the market. Nothing
      here is cached on purpose — a stale quote is worse than none.
    </p>
    <button onclick="location.reload()">Try again</button>
    <script>
      // Reload the moment the connection returns, so the app recovers without
      // being tapped.
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
